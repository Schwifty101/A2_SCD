apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: rahbar
  labels:
    app.kubernetes.io/name: chroma
    app.kubernetes.io/component: vectorstore
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chroma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chroma
        app.kubernetes.io/component: vectorstore
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false  # Service 'chroma' would inject CHROMA_PORT=tcp://..., which Chroma parses as its port
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: chroma
          image: chromadb/chroma:1.0.12
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: PERSIST_DIRECTORY
              value: "/chroma/data"
            - name: ANONYMIZED_TELEMETRY
              value: "FALSE"
          securityContext:
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: chroma-data
              mountPath: /data  # image persists to /data (PERSIST_DIRECTORY is ignored in 1.0.x)
  volumeClaimTemplates:
    - metadata:
        name: chroma-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chroma
  namespace: rahbar
  labels:
    app.kubernetes.io/name: chroma
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: chroma

