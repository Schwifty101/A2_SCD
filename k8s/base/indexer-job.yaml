apiVersion: batch/v1
kind: Job
metadata:
  name: indexer-manual
  namespace: rahbar
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/component: indexer
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indexer
    spec:
      serviceAccountName: rahbar-indexer
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "pipeline.run"]
          envFrom:
            - configMapRef:
                name: rahbar-config
          securityContext:
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: corpus-volume
              mountPath: /corpus
      volumes:
        - name: corpus-volume
          persistentVolumeClaim:
            claimName: corpus-data

