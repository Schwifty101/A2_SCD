apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
data:
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  TOP_K: "5"
  TEMPERATURE: "0.2"
  RELEVANCE_FLOOR: "0.65"
  CACHE_THRESHOLD: "0.90"
  EMBED_MODEL: "nomic-embed-text"
  LLM_PROVIDER: "stub"
  LLM_MODEL: "llama3.2:3b"
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CACHE_ENABLED: "true"
  LOG_LEVEL: "INFO"
  CORPUS_DIR: "/corpus"

