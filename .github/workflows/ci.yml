name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linters
        run: |
          pip install ruff mypy pydantic httpx pytest

      - name: Run ruff
        run: |
          ruff check api indexer eval corpus

      - name: Run mypy
        run: |
          mypy api/app indexer/pipeline

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt pytest-cov

      - name: Run tests with coverage gate
        run: |
          export PYTHONPATH="api:indexer"
          pytest --cov=app --cov=pipeline --cov-report=term --cov-report=xml --cov-fail-under=60

  manifests:
    name: Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Validate manifests with Kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          kustomize build k8s/overlays/dev | kubeconform -strict -summary
          kustomize build k8s/overlays/prod | kubeconform -strict -summary

  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: [lint, test, manifests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -t rahbar-api:${{ github.sha }} api

      - name: Build Indexer Docker image
        run: docker build -t rahbar-indexer:${{ github.sha }} indexer

      - name: Build UI Docker image
        run: docker build -t rahbar-ui:${{ github.sha }} ui

  scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build local image for scanning
        run: docker build -t rahbar-api:${{ github.sha }} api

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.29.0
        continue-on-error: true
        with:
          image-ref: rahbar-api:${{ github.sha }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  e2e-eval:
    name: End-to-End Evaluation on Kind
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: rahbar-ci

      - name: Build and load local images into kind
        run: |
          docker build -t rahbar-api:dev api
          docker build -t rahbar-indexer:dev indexer
          docker build -t rahbar-ui:dev ui
          kind load docker-image rahbar-api:dev --name rahbar-ci
          kind load docker-image rahbar-indexer:dev --name rahbar-ci
          kind load docker-image rahbar-ui:dev --name rahbar-ci

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k k8s/overlays/dev
          kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="ci-dummy-key" --dry-run=client -o yaml | kubectl apply -f -

      - name: Run indexer Job on fixture corpus
        run: |
          kubectl create job --from=cronjob/reindex indexer-fixture-eval -n rahbar
          kubectl wait --for=condition=complete job/indexer-fixture-eval -n rahbar --timeout=120s

      - name: Wait for API rollout
        run: |
          kubectl rollout status deployment/api -n rahbar --timeout=120s

      - name: Set up port forwarding
        run: |
          kubectl port-forward svc/api 8000:8000 -n rahbar &
          sleep 3

      - name: Run evaluation gate
        run: |
          pip install httpx pyyaml
          python eval/run_eval.py --api http://127.0.0.1:8000 --golden eval/fixtures/golden.fixture.yaml --update-baseline

