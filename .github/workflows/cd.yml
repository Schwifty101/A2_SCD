name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt pytest-cov

      - name: Run pytest
        run: |
          export PYTHONPATH="api:indexer"
          pytest -q

  build-push:
    name: Build & Push Images to Registry
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API Image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:latest

      - name: Build and push Indexer Image
        uses: docker/build-push-action@v6
        with:
          context: indexer
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:latest

      - name: Build and push UI Image
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:latest

  deploy:
    name: Ephemeral Cluster Deployment & Verification
    runs-on: ubuntu-latest
    needs: [build-push]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: rahbar-deploy

      - name: Deploy application stack
        run: |
          kubectl apply -k k8s/overlays/dev
          kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="smoke-test-key" --dry-run=client -o yaml | kubectl apply -f -

      - name: Wait for API rollout
        run: |
          kubectl rollout status deployment/api -n rahbar --timeout=180s

      - name: Wait for UI rollout
        run: |
          kubectl rollout status deployment/ui -n rahbar --timeout=120s

      - name: Smoke test via Service
        run: |
          kubectl port-forward svc/api 8000:8000 -n rahbar &
          sleep 4
          curl -s -f http://127.0.0.1:8000/healthz | grep "alive"
          echo "Smoke test passed successfully."

